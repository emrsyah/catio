<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catio</title>
  </head>
  <body>
    <div class="strip" data-tauri-drag-region>
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <div class="controls">
        <button type="button" id="btn-min" aria-label="Kecilin ke tray" title="Kecilin ke tray (Esc)">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 6h7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
        </button>
        <button type="button" id="btn-max" aria-label="Full screen" title="Full screen (F11)">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
        </button>
        <button type="button" id="btn-hide" aria-label="Tutup ke tray" title="Tutup (tetap jalan di tray, keluar lewat menu tray)">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
        </button>
      </div>
    </div>
    <main id="editor" aria-label="catio.md"></main>

    <!-- Undecorated window: these edges are the resize borders. -->
    <div class="rz rz-n" data-dir="North"></div>
    <div class="rz rz-s" data-dir="South"></div>
    <div class="rz rz-e" data-dir="East"></div>
    <div class="rz rz-w" data-dir="West"></div>
    <div class="rz rz-ne" data-dir="NorthEast"></div>
    <div class="rz rz-nw" data-dir="NorthWest"></div>
    <div class="rz rz-se" data-dir="SouthEast"></div>
    <div class="rz rz-sw" data-dir="SouthWest"></div>
    <div class="drop-line" id="drop-line" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
